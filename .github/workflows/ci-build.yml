name: CI Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WIMC.sln

      - name: Build Solution (x64 Release)
        run: dotnet build WIMC.sln -c Release -p:Platform=x64 --no-restore

      - name: Publish Prototype Executable
        run: dotnet publish src/WindowsIsland.Prototype/WindowsIsland.Prototype.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIMC-Prototype-x64
          path: publish/
